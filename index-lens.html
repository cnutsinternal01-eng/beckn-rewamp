<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Circle Lens Reveal</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:system-ui;
  overflow:hidden;
  background:#fff;
}

/* ---------------- HERO ---------------- */
.hero{
  position:relative;
  height:100vh;
  width:100%;
  background:#fff;
  overflow:hidden;
}

/* ---------------- CIRCLE IMAGES ---------------- */
.circles{
  position:absolute;
  inset:0;
}

.bubble{
  position:absolute;
  width:160px;
  height:160px;
  border-radius:50%;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  transition:transform .3s ease;
}

.bubble img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* hover small scale */
.bubble:hover{
  transform:scale(1.06);
}

/* random placements */
.b1{top:10%;left:18%}
.b2{top:30%;right:15%}
.b3{bottom:15%;left:22%}
.b4{top:55%;left:50%}
.b5{bottom:25%;right:25%}
.b6{top:15%;right:40%}

/* ---------------- WHITE MASK OVERLAY ---------------- */
.overlay{
  position:absolute;
  inset:0;
  background:#fff;
  pointer-events:none;

  /* lens hole */
  -webkit-mask-image: radial-gradient(circle 180px at 50% 50%, transparent 0%, transparent 150px, black 170px);
  mask-image: radial-gradient(circle 180px at 50% 50%, transparent 0%, transparent 150px, black 170px);
}

/* title */
.title{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:34px;
  font-weight:600;
  color:#222;
  pointer-events:none;
}
</style>
</head>


<body>

<section class="hero">

  <div class="circles">

    <div class="bubble b1">
      <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1200">
    </div>

    <div class="bubble b2">
      <img src="https://images.unsplash.com/photo-1482192596544-9eb780fc7f66?q=80&w=1200">
    </div>

    <div class="bubble b3">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200">
    </div>

    <div class="bubble b4">
      <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=1200">
    </div>

    <div class="bubble b5">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200">
    </div>

    <div class="bubble b6">
      <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?q=80&w=1200">
    </div>

  </div>

  <div class="overlay"></div>

  <h1 class="title">Move your mouse to discover ✨</h1>

</section>


<script>
const hero = document.querySelector(".hero");
const overlay = document.querySelector(".overlay");
const bubbles = document.querySelectorAll(".bubble");

let mouseX = window.innerWidth/2;
let mouseY = window.innerHeight/2;
let currentX = mouseX;
let currentY = mouseY;

const isTouch = window.matchMedia("(pointer: coarse)").matches;


////////////////////////////////////////////////////
// DESKTOP → MOUSE FOLLOW
////////////////////////////////////////////////////
if(!isTouch){

  hero.addEventListener("mousemove",(e)=>{
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

}


////////////////////////////////////////////////////
// MOBILE → AUTO TOUR MODE
////////////////////////////////////////////////////
else{

  document.querySelector(".title").innerText = "Exploring for you ✨";

  const positions = [];

  // get center of each bubble
  bubbles.forEach(b=>{
    const rect = b.getBoundingClientRect();

    positions.push({
      x: rect.left + rect.width/2,
      y: rect.top + rect.height/2
    });
  });

  let index = 0;

  function moveToNext(){

    mouseX = positions[index].x;
    mouseY = positions[index].y;

    index = (index + 1) % positions.length;
  }

  moveToNext();
  setInterval(moveToNext, 3000); // 3s per bubble
}


////////////////////////////////////////////////////
// SMOOTH LENS ANIMATION LOOP
////////////////////////////////////////////////////
function animate(){

  currentX += (mouseX - currentX) * 0.12;
  currentY += (mouseY - currentY) * 0.12;

  overlay.style.webkitMaskImage =
    `radial-gradient(circle 180px at ${currentX}px ${currentY}px,
      transparent 0px,
      transparent 150px,
      black 170px)`;

  overlay.style.maskImage =
    `radial-gradient(circle 180px at ${currentX}px ${currentY}px,
      transparent 0px,
      transparent 150px,
      black 170px)`;

  requestAnimationFrame(animate);
}

animate();
</script>


</body>
</html>
