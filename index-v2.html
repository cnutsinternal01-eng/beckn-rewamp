<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<title>Morph Hero</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:system-ui;
  overflow:hidden;
  background:#fff;
}

/* ---------------- HERO ---------------- */
.hero{
  position:relative;
  height:100vh;
  width:100%;
}

/* circles layout */
.bubble{
  position:absolute;
  width:140px;
  height:140px;
  border-radius:50%;
  overflow:hidden;
  cursor:pointer;
}

.bubble img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* random placement */
.b1{top:15%;left:20%}
.b2{top:30%;right:20%}
.b3{bottom:20%;left:18%}
.b4{bottom:25%;right:25%}
.b5{top:45%;left:45%}

/* info card */
.card{
  position:fixed;
  bottom:60px;
  right:60px;
  width:320px;
  padding:28px;

  background:rgba(255,255,255,.85);
  backdrop-filter:blur(14px);
  border-radius:16px;

  opacity:0;
  transform:translateY(40px);
  z-index:999;
}

.card a{
  text-decoration:none;
  font-weight:600;
}

/* morph clone image */
.morph-img{
  position:fixed;
  object-fit:cover;
  z-index:998;
  pointer-events:none;
}
</style>
</head>


<body>

<section class="hero">

  <div class="bubble b1" data-title="Agriculture" data-link="#">
    <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=2000">
  </div>

  <div class="bubble b2" data-title="Transport" data-link="#">
    <img src="https://images.unsplash.com/photo-1482192596544-9eb780fc7f66?q=80&w=2000">
  </div>

  <div class="bubble b3" data-title="Energy" data-link="#">
    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=2000">
  </div>

  <div class="bubble b4" data-title="Ocean" data-link="#">
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2000">
  </div>

  <div class="bubble b5" data-title="Cities" data-link="#">
    <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=2000">
  </div>

</section>


<div class="card">
  <h3></h3>
  <a target="_blank">Explore →</a>
</div>


<script>
const bubbles = document.querySelectorAll(".bubble");
const hero = document.querySelector(".hero");
const card = document.querySelector(".card");
const title = card.querySelector("h3");
const link = card.querySelector("a");

let clone = null;
let activeBubble = null;


/* ---------------- OPEN ---------------- */
bubbles.forEach(bubble=>{

  bubble.addEventListener("mouseenter", ()=>{

    if(clone) return; // already open

    activeBubble = bubble;

    const img = bubble.querySelector("img");
    const rect = img.getBoundingClientRect();

    clone = img.cloneNode(true);
    clone.classList.add("morph-img");

    Object.assign(clone.style,{
      top: rect.top+"px",
      left: rect.left+"px",
      width: rect.width+"px",
      height: rect.height+"px",
      borderRadius:"50%"
    });

    document.body.appendChild(clone);

    bubble.style.visibility = "hidden";

    // expand
    gsap.to(clone,{
      top:0,
      left:0,
      width:window.innerWidth,
      height:window.innerHeight,
      borderRadius:0,
      duration:0.8,
      ease:"power3.inOut"
    });

    title.innerText = bubble.dataset.title;
    link.href = bubble.dataset.link;

    gsap.to(card,{
      opacity:1,
      y:0,
      delay:0.4,
      duration:0.4
    });

  });

});


/* ---------------- CLOSE (important fix) ---------------- */
hero.addEventListener("mouseleave", ()=>{

  if(!clone) return;

  const rect = activeBubble.getBoundingClientRect();

  gsap.to(card,{
    opacity:0,
    y:40,
    duration:0.3
  });

  gsap.to(clone,{
    top:rect.top,
    left:rect.left,
    width:rect.width,
    height:rect.height,
    borderRadius:"50%",
    duration:0.7,
    ease:"power3.inOut",
    onComplete:()=>{
      activeBubble.style.visibility="visible";
      clone.remove();
      clone = null;
      activeBubble = null;
    }
  });

});

</script>

</body>
</html>
